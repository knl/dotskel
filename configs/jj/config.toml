# https://github.com/martinvonz/jj/blob/main/docs/config.md
[user]
    name = 'Nikola Knezevic'
    email = 'nikola.knezevic@imc.com'

[revset-aliases]
    archived = 'description(glob:"(jj archive)*")'
    local = 'mutable() ~ archived'
    'chain(revisions)' = 'ancestors(revisions) & local'
    local_unarchived = 'local ~ archived'
    og = 'trunk()'
    interesting = 'og | ancestors(local | working_copies(), 2)'
    deflog = 'interesting | ancestors(og, 5)'
    localstale = 'local_unarchived ~ descendants(og)'
    'empty_description()' = 'description(exact:"")'
    'closest_pushable(to)' = 'heads(::to & mutable() & ~empty_description() & (~empty() | merges()))'
    'last' = 'latest(ancestors(@) & ~empty() & ~empty_description())'

[template-aliases]
    'commit_timestamp(commit)' = '''
        if(commit.current_working_copy() || commit.hidden(),
            commit.committer().timestamp().ago(),
            commit.author().timestamp().ago()
        )
    '''
    'format_short_change_id(id)' = 'id.shortest()'
    'hyperlink(url, text)' = '''
        raw_escape_sequence("\e]8;;" ++ url ++ "\e\\") ++
        text ++
        raw_escape_sequence("\e]8;;\e\\")
    '''
    'gerrit_change_id(change_id)' = '"Id0000000" ++ change_id.normal_hex()'
    'format_short_change_id_with_gerrit_hyperlink(commit)' = '''
        hyperlink(
            "https://gerrit/q/" ++
            coalesce(
                commit.trailers().map(|trailer|
                    if(trailer.key() == "Change-Id", trailer.value())
                ).join(""),
                gerrit_change_id(commit.change_id())
            ),
            format_short_change_id(commit.change_id())
        )
    '''
    'format_short_change_id_with_hidden_and_divergent_info(commit)' = '''
        if(commit.hidden(),
            label("hidden",
                format_short_change_id_with_gerrit_hyperlink(commit) ++
                " hidden"
            ),
            label(if(commit.divergent(), "divergent"),
                format_short_change_id_with_gerrit_hyperlink(commit) ++
                if(commit.divergent(), "?")
            )
        )
    '''
    'format_short_commit_id(id)' = 'id.shortest(7)'
    'format_short_signature(signature)' = '''
        coalesce(signature.email().local(), email_placeholder)'''
    'format_timestamp(timestamp)' = 'timestamp'
    'oneline(commit)' = '''
        separate(commit_summary_separator,
            format_short_commit_id(commit.commit_id()),
            separate(" ",
                if(commit.conflict(), label("conflict", "(conflict)")),
                if(commit.empty(), label("empty", "(empty)")),
                if(commit.description(),
                    commit.description().first_line(),
                    label(if(commit.empty(), "empty"), description_placeholder)
                )
            ),
            separate(" ",
                if(commit.contained_in('first_parent(@)'), label("git_head", "git_head()")),
                commit.bookmarks(),
                commit.tags(),
                commit.working_copies()
            ),
            format_short_change_id_with_hidden_and_divergent_info(commit)
        ) ++ "\n"
    '''
    status = '''
        "@ Working copy changes:\n" ++
        indent("    ", diff.summary()) ++
        if(conflict,
            "\nx Conflicts:\n" ++
            indent("    ", conflicted_files.map(|x|
                label("conflict", "x " ++ x.path())).join("\n")) ++
            "\n"
        ) ++
        "\n| Parent commit changes:\n" ++
        indent("    ", parents.map(|x| x.diff().summary()).join("")) ++
        "\n"
    '''
    'unarchived(description)' = """
        description.remove_prefix("(jj archive) ").remove_suffix("\n")
    """

[aliases]
    tug = ["bookmark", "advance"]
    ab = ['absorb']
    am = ['amend']
    bg = [
        '--config=ui.log-word-wrap=false',
        '--ignore-working-copy',
        '--no-pager']
    bgc = ['bg', '--color=always']
    list = ['log', '--no-graph']
    lg = ['log', '-T', 'builtin_log_compact_full_description', '--patch', '--no-graph']
    reword = ['describe']
    archive = [
        'util', 'exec', '--', 'sh', '-c', '''
            m=$(
                jj bgc list \
                    --template='"(jj archive) " ++ unarchived(description)' \
                    --revisions="$*") \
            && jj reword --message="$m" "$*"
        ''', '']
    bookmarks = ['list', '--template=bookmarks ++ "\n"']
    changes = ['list', '--template=change_id.short() ++ "\n"']
    commits = ['list', '--template=commit_id.short() ++ "\n"']
    delta = [
        '''--config=ui.pager=[
            "delta", "--line-numbers", "--navigate", "--side-by-side"]''',
        'diff', '--git']
    hide = ['abandon']
    hideempty = ['hide', 'empty() & local ~ root()']
    # `jj push`:
    #   - For Gerrit, uploads @ when it is non-empty and described; otherwise @-.
    #   - For a normal Git remote, runs plain `jj git push`.
    #
    # `jj push <revision>`:
    #   - Pushes the explicitly selected change/revision.
    #   - For Gerrit, this becomes `jj gerrit upload -r <revision>`.
    #   - For normal Git, this becomes `jj git push --change <revision>`.
    #
    # Optionally configure a lint command per repository:
    #   jj config set --repo push.lint-command 'uv run ruff check . && uv run pytest'
    #
    # Without push.lint-command, the alias warns and continues.
    #
    # For Gerrit repositories, configure the remote and target branch:
    #   jj config set --repo gerrit.default-remote origin
    #   jj config set --repo gerrit.default-remote-branch master
    #
    # Leave the Gerrit settings unset for ordinary Git repositories.
    push = ["util", "exec", "--", "/bin/zsh", "-c", '''
        set -euo pipefail

        if (( $# > 1 )); then
            echo "usage: jj push [revision]" >&2
            exit 2
        fi

        explicit_revision=0

        if (( $# == 1 )); then
            revision="$1"
            explicit_revision=1
        else
            revision="@-"

            # The working-copy change @ is pushable when it is both non-empty
            # and described. Otherwise, use the previously committed change @-.
            if [[ -n "$(jj log --no-graph \
                -r '@ & ~empty() & ~description(exact:"")' \
                -T 'change_id')" ]]; then
            revision="@"
            fi
        fi

        if lint_command="$(jj config get push.lint-command 2>/dev/null)"; then
            jj run -r "trunk()..($revision)" -- /bin/zsh -c "$lint_command"
        else
            echo "warning: push.lint-command is not configured; skipping lint" >&2
        fi

        if remote_branch="$(jj config get gerrit.default-remote-branch 2>/dev/null)"; then
            jj gerrit upload \
            -r "$revision" \
            --remote-branch "$remote_branch"
        elif (( explicit_revision )); then
            jj git push --change "$revision"
        else
            jj git push
        fi
        ''', "jj-push"]
    rebasestale = [
        'rebase',
        '--source=roots(localstale)', '--destination=og', '--skip-emptied']
    revlog = ['evolog']
    rollback = ['revert']
    unarchive = [
        'util', 'exec', '--', 'sh', '-c', '''
            m=$(
                jj bgc list \
                    --template='unarchived(description)' --revisions="$*") \
            && jj reword --message="$m" "$*"
        ''', '']
    up = ['new']
    whatsout = ['diff', '--summary']

[colors]
    'description placeholder' = 'red'
    'working_copy description placeholder' = 'default'
    working_copy.underline = true

[fsmonitor]
    # backend = 'watchman'

# [fsmonitor.watchman]
#     register-snapshot-trigger = true

[git]
    push = 'origin'

[merge-tools.difft]
    diff-args = ['--color=always', '$left', '$right']

[merge-tools.pycharm]
    merge-args = ['merge', '$left', '$right', '$base', '$output']

[ui]
    diff-editor = ':builtin'
    diff-instructions = false
    log-word-wrap = true
    merge-editor = 'vscode'
    default-command = ["log", "-r", "deflog"]

[revsets]
    short-prefixes = 'interesting'
    # Pick @ parents reachable from the nearest bookmarks.
    # Errors out if ambiguous, by design
    bookmark-advance-to = "@- & heads(::@ & bookmarks())::"

[templates]
    push-bookmark-prefix = 'knl/jj_'
    draft_commit_description = '''
        concat(
            coalesce(description, default_commit_description, "\n"),
            surround(
                "\nJJ: This commit contains the following changes:\n", "",
                indent("JJ:     ", diff.stat(72)),
            ),
            "\nJJ: ignore-rest\n",
            diff.git(),
        )
    '''
